<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0f" />
    <title>Buzzly Offline</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070a0f;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 360px;
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icons/icon-192.png" alt="Buzzly" />
      <h1>Buzzly is offline</h1>
      <p>The editor shell is ready, but saved setups, uploads, and AI tools need an internet connection.</p>
    </main>
  </body>
</html>
